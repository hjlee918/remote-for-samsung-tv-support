name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer and operating system
      placeholder: "Mac Studio, macOS 26.1  /  Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: streamdeck
    attributes:
      label: Stream Deck app version and device
      placeholder: "7.1, Stream Deck +"
  - type: input
    id: tv
    attributes:
      label: TV model and year
      description: The model is on the back of the TV or in Settings → Support → About This TV.
      placeholder: "QN65Q80CAFXZA (2023)"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Plugin log
      description: |
        Attach or paste the latest file from:
        macOS: ~/Library/Application Support/com.elgato.StreamDeck/Plugins/com.johnlee.samsungtvremote.sdPlugin/logs/
        Windows: %APPDATA%\Elgato\StreamDeck\Plugins\com.johnlee.samsungtvremote.sdPlugin\logs\
      render: text
